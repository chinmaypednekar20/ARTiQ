<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auctions | Artist Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ARTiQ</h2>
                <button id="sidebarToggle" class="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="sidebar-content">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <h3 id="artistName">Artist Name</h3>
                        <p>Artist</p>
                    </div>
                </div>
                <nav class="sidebar-nav">
                    <ul>
                        <li>
                            <a href="/dashboard">
                                <i class="fas fa-tachometer-alt"></i>
                                <span>Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <a href="/paintings">
                                <i class="fas fa-palette"></i>
                                <span>Paintings</span>
                            </a>
                        </li>
                        <li class="active">
                            <a href="/auctions">
                                <i class="fas fa-gavel"></i>
                                <span>Auctions</span>
                            </a>
                        </li>
                        <li>
                            <a href="/orders">
                                <i class="fas fa-shopping-cart"></i>
                                <span>Orders</span>
                            </a>
                        </li>
                        <li>
                            <a href="/messages">
                                <i class="fas fa-envelope"></i>
                                <span>Messages</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>Auctions</h1>
                <div class="header-actions">
                    <button id="createAuctionBtn" class="btn-primary">
                        <i class="fas fa-plus"></i> Create Auction
                    </button>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="card">
                    <div class="card-header">
                        <h2>Active Auctions</h2>
                        <div class="filter-options">
                            <select id="auctionStatusFilter">
                                <option value="all">All Auctions</option>
                                <option value="active" selected>Active</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="auctionsGrid" class="auctions-grid">
                            <!-- Auctions will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Create Auction Modal -->
    <div id="createAuctionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Auction</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="createAuctionForm">
                    <div class="form-group">
                        <label for="paintingSelect">Select Painting</label>
                        <select id="paintingSelect" name="painting_id" required>
                            <option value="">Select a Painting</option>
                            <!-- Paintings will be loaded here -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="startingPrice">Starting Price (₹)</label>
                        <input type="number" id="startingPrice" name="starting_price" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="endTime">End Date & Time</label>
                        <input type="datetime-local" id="endTime" name="end_time" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary cancel-modal">Cancel</button>
                        <button type="submit" class="btn-primary">Create Auction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Cancel Auction Modal -->
    <div id="cancelAuctionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Cancel Auction</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to cancel this auction? This action cannot be undone.</p>
                <input type="hidden" id="cancelAuctionId">
                <div class="form-actions">
                    <button type="button" class="btn-secondary cancel-modal">No, Keep It</button>
                    <button type="button" id="confirmCancelBtn" class="btn-danger">Yes, Cancel Auction</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auctions.js"></script>
</body>
</html>
