<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paintings | Artist Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ARTiQ</h2>
                <button id="sidebarToggle" class="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="sidebar-content">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <h3 id="artistName">Artist Name</h3>
                        <p>Artist</p>
                    </div>
                </div>
                <nav class="sidebar-nav">
                    <ul>
                        <li>
                            <a href="/dashboard">
                                <i class="fas fa-tachometer-alt"></i>
                                <span>Dashboard</span>
                            </a>
                        </li>
                        <li class="active">
                            <a href="/paintings">
                                <i class="fas fa-palette"></i>
                                <span>Paintings</span>
                            </a>
                        </li>
                        <li>
                            <a href="/auctions">
                                <i class="fas fa-gavel"></i>
                                <span>Auctions</span>
                            </a>
                        </li>
                        <li>
                            <a href="/orders">
                                <i class="fas fa-shopping-cart"></i>
                                <span>Orders</span>
                            </a>
                        </li>
                        <li>
                            <a href="/messages">
                                <i class="fas fa-envelope"></i>
                                <span>Messages</span>
                                <span class="nav-badge" id="messagesBadge" style="display:none"></span>
                            </a>
                        </li>
                        <li>
                            <a href="/profile">
                                <i class="fas fa-user-cog"></i>
                                <span>Profile Settings</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>Paintings</h1>
                <div class="header-actions">
                    <button id="addPaintingBtn" class="btn-primary">
                        <i class="fas fa-plus"></i> Add Painting
                    </button>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="card">
                    <div class="card-header">
                        <h2>My Paintings</h2>
                        <div class="filter-options">
                            <select id="categoryFilter">
                                <option value="">All Categories</option>
                                <option value="abstract">Abstract</option>
                                <option value="landscape">Landscape</option>
                                <option value="portrait">Portrait</option>
                                <option value="still-life">Still Life</option>
                                <option value="modern">Modern</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="paintingsGrid" class="paintings-grid">
                            <!-- Paintings will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Painting Modal -->
    <div id="addPaintingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Painting</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addPaintingForm">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="price">Price (₹)</label>
                            <input type="number" id="price" name="price" step="0.01" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category" required>
                                <option value="">Select Category</option>
                                <option value="abstract">Abstract</option>
                                <option value="landscape">Landscape</option>
                                <option value="portrait">Portrait</option>
                                <option value="still-life">Still Life</option>
                                <option value="modern">Modern</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="image">Image</label>
                        <input type="file" id="image" name="image" accept="image/*" required>
                        <div id="imagePreview" class="image-preview"></div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary cancel-modal">Cancel</button>
                        <button type="submit" class="btn-primary">Save Painting</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Painting Modal -->
    <div id="editPaintingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Painting</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editPaintingForm">
                    <input type="hidden" id="editPaintingId" name="paintingId">
                    <div class="form-group">
                        <label for="editTitle">Title</label>
                        <input type="text" id="editTitle" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="editDescription">Description</label>
                        <textarea id="editDescription" name="description" rows="4"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editPrice">Price (₹)</label>
                            <input type="number" id="editPrice" name="price" step="0.01" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="editCategory">Category</label>
                            <select id="editCategory" name="category" required>
                                <option value="">Select Category</option>
                                <option value="abstract">Abstract</option>
                                <option value="landscape">Landscape</option>
                                <option value="portrait">Portrait</option>
                                <option value="still-life">Still Life</option>
                                <option value="modern">Modern</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="editImage">Image (Leave empty to keep current image)</label>
                        <input type="file" id="editImage" name="image" accept="image/*">
                        <div id="editImagePreview" class="image-preview"></div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary cancel-modal">Cancel</button>
                        <button type="submit" class="btn-primary">Update Painting</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteConfirmModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Confirm Delete</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this painting? This action cannot be undone.</p>
                <input type="hidden" id="deletePaintingId">
                <div class="form-actions">
                    <button type="button" class="btn-secondary cancel-modal">Cancel</button>
                    <button type="button" id="confirmDeleteBtn" class="btn-danger">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/paintings.js"></script>
</body>
</html>
