<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | Artist Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ARTiQ</h2>
                <button id="sidebarToggle" class="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="sidebar-content">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <h3 id="artistName">Artist Name</h3>
                        <p>Artist</p>
                    </div>
                </div>
                <nav class="sidebar-nav">
                    <ul>
                        <li>
                            <a href="/dashboard">
                                <i class="fas fa-tachometer-alt"></i>
                                <span>Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <a href="/paintings">
                                <i class="fas fa-palette"></i>
                                <span>Paintings</span>
                            </a>
                        </li>
                        <li>
                            <a href="/auctions">
                                <i class="fas fa-gavel"></i>
                                <span>Auctions</span>
                            </a>
                        </li>
                        <li>
                            <a href="/orders">
                                <i class="fas fa-shopping-cart"></i>
                                <span>Orders</span>
                            </a>
                        </li>
                        <li class="active">
                            <a href="/messages">
                                <i class="fas fa-envelope"></i>
                                <span>Messages</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>Messages</h1>
            </header>

            <div class="dashboard-content">
                <div class="card" style="height: calc(100vh - var(--header-height) - 60px);">
                    <div class="messages-container">
                        <div class="clients-list" id="clientsList">
                            <!-- Clients will be loaded here -->
                        </div>
                        <div class="chat-area">
                            <div id="emptyChat" class="empty-state">
                                <i class="fas fa-comments"></i>
                                <p>Select a client to view messages</p>
                            </div>
                            <div id="chatContainer" style="display: none; flex-direction: column; height: 100%;">
                                <div class="chat-header">
                                    <h3 id="chatClientName">Client Name</h3>
                                </div>
                                <div class="chat-messages" id="chatMessages">
                                    <!-- Messages will be loaded here -->
                                </div>
                                <div class="chat-input">
                                    <form id="messageForm">
                                        <input type="hidden" id="clientId" name="client_id">
                                        <input type="text" id="messageInput" name="message" placeholder="Type your message..." required>
                                        <button type="submit">Send</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/messages.js"></script>
</body>
</html>
