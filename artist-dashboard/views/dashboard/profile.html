<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings | ARTiQ Artist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        .profile-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 32px;
        }
        @media (max-width: 900px) {
            .profile-container { grid-template-columns: 1fr; }
        }
        .avatar-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 36px 24px;
        }
        .avatar-preview-box {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
            background: var(--dark-3);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-preview-box span {
            font-size: 3.5rem;
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-weight: 700;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 16px;
            background: var(--dark-3);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.92rem;
            outline: none;
            transition: var(--transition);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }
        .form-group input[readonly] {
            opacity: 0.7;
            cursor: not-allowed;
            background: var(--dark-1);
        }
        .toast-msg {
            display: none;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .toast-msg.success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .toast-msg.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ARTiQ</h2>
                <button id="sidebarToggle" class="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="sidebar-content">
                <div class="user-info" style="cursor: pointer;" onclick="window.location.href='/profile'">
                    <div class="user-avatar" id="userAvatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <h3 id="artistName">Artist Name</h3>
                        <p>Artist Studio</p>
                    </div>
                </div>
                <nav class="sidebar-nav">
                    <ul>
                        <li>
                            <a href="/dashboard">
                                <i class="fas fa-tachometer-alt"></i>
                                <span>Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <a href="/paintings">
                                <i class="fas fa-palette"></i>
                                <span>Paintings</span>
                            </a>
                        </li>
                        <li>
                            <a href="/auctions">
                                <i class="fas fa-gavel"></i>
                                <span>Auctions</span>
                            </a>
                        </li>
                        <li>
                            <a href="/orders">
                                <i class="fas fa-shopping-cart"></i>
                                <span>Orders</span>
                            </a>
                        </li>
                        <li>
                            <a href="/messages">
                                <i class="fas fa-envelope"></i>
                                <span>Messages</span>
                                <span class="nav-badge" id="messagesBadge" style="display:none"></span>
                            </a>
                        </li>
                        <li class="active">
                            <a href="/profile">
                                <i class="fas fa-user-cog"></i>
                                <span>Profile Settings</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>Artist Profile & Studio Settings</h1>
            </header>

            <div class="dashboard-content">
                <div id="statusToast" class="toast-msg"></div>

                <div class="profile-container">
                    <!-- Avatar Upload Card -->
                    <div class="card avatar-card">
                        <div class="avatar-preview-box" id="profileAvatarBox">
                            <i class="fas fa-user" style="font-size:3rem;color:var(--text-muted)"></i>
                        </div>
                        <h3 id="cardArtistName" style="font-family:'Playfair Display',serif;margin-bottom:6px;font-size:1.3rem;">Artist Name</h3>
                        <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:20px;">Master Fine Artist</p>
                        
                        <input type="file" id="profilePicInput" accept="image/*" style="display:none">
                        <button type="button" class="btn-primary" id="uploadPicBtn" style="width:100%;justify-content:center;margin-bottom:10px;">
                            <i class="fas fa-camera" style="margin-right:8px;"></i> Upload Profile Photo
                        </button>
                        <p style="font-size:0.75rem;color:var(--text-muted)">JPG, PNG or WEBP (Max 5MB)</p>
                    </div>

                    <!-- Personal Settings Form -->
                    <div class="card" style="padding: 32px;">
                        <h2 style="font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:24px;">Personal Information</h2>
                        
                        <form id="profileForm">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="name">Display / Studio Name</label>
                                    <input type="text" id="name" required>
                                </div>
                                <div class="form-group">
                                    <label for="email">Email Address</label>
                                    <input type="email" id="email" readonly>
                                </div>
                                <div class="form-group">
                                    <label for="phone">Phone Number</label>
                                    <input type="tel" id="phone" required>
                                </div>
                                <div class="form-group">
                                    <label for="age">Age</label>
                                    <input type="number" id="age" min="16" max="120" required>
                                </div>
                                <div class="form-group">
                                    <label for="gender">Gender</label>
                                    <select id="gender" required>
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                                <div class="form-group full-width">
                                    <label for="bio">Artist Bio & Creative Philosophy</label>
                                    <textarea id="bio" rows="4" placeholder="Share your artistic journey, mediums of mastery, and inspirations with art collectors..."></textarea>
                                </div>
                            </div>
                            
                            <div style="margin-top:20px;display:flex;justify-content:flex-end;">
                                <button type="submit" class="btn-primary" id="saveProfileBtn">
                                    <i class="fas fa-save" style="margin-right:8px;"></i> Save Profile Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
